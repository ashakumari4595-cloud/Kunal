name: Build AVYAKT AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env file
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AVYAKT-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVYAKT-AI-APK
          path: app/build/outputs/apk/debug/AVYAKT-AI.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: AVYAKT AI — Latest APK
          body: |
            Automatically built installable Android APK (`AVYAKT-AI.apk`) for AVYAKT AI.
            Tap `AVYAKT-AI.apk` below to download directly on your Android phone.
          files: app/build/outputs/apk/debug/AVYAKT-AI.apk
          make_latest: true
